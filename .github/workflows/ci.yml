# Roda o lint (ruff) e os testes (pytest) a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telegram
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: telegram_vendas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telegram -d telegram_vendas"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Os testes criam e usam o banco telegram_vendas_test
      DATABASE_URL: postgresql+psycopg://telegram:ci_password@localhost:5432/telegram_vendas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest -q
