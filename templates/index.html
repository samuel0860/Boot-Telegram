<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="robots" content="noindex">
  <title>Verificação de acesso</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Confirmação apenas visual (etapa de interação). NÃO é um CAPTCHA e não protege contra bots. -->
  <main class="wrap">
    <section class="card" aria-labelledby="title">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      </div>
      <h1 id="title">Verificação de acesso</h1>
      <p class="subtitle">Para continuar, confirme que você não é um robô.</p>

      <button type="button" class="check" id="check" role="checkbox" aria-checked="false">
        <span class="box" aria-hidden="true">
          <span class="spinner"></span>
          <svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </span>
        <span class="label">Não sou um robô</span>
      </button>

      <p class="status" id="status" aria-live="polite"></p>

      <a class="continue" id="continue" href="{{ telegram_link }}" data-href="{{ telegram_link }}"
         rel="noopener" hidden aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9.04 15.47 8.9 19.5c.4 0 .58-.17.79-.38l1.9-1.82 3.94 2.89c.72.4 1.24.19 1.43-.67l2.6-12.2c.24-1.08-.39-1.5-1.09-1.24L3.2 11.8c-1.05.41-1.03 1-.18 1.27l3.9 1.22 9.05-5.7c.43-.28.82-.13.5.15"/></svg>
        Continuar no Telegram
      </a>
    </section>
    <footer class="foot">Ao continuar, você será direcionado ao nosso atendimento oficial no Telegram.</footer>
  </main>
  <script src="/static/js/script.js" defer></script>
</body>
</html>
